# 문구(Strings.swift)는 scripts/generate-strings.py 가 Localization.xcstrings 에서 만든다 (GH-100)
xcassets:
  inputs:
    - seep-ios/Resources/Images.xcassets
    - seep-ios/Resources/Assets.xcassets
    - seep-ios/Resources/Icons.xcassets
  outputs:
    templateName: swift5
    output: seep-ios/Generated/Assets.swift
    params:
        enumName: Assets

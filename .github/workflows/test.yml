name: Test

# 모든 PR에서 실행 (base가 feature 브랜치인 스택 PR 포함)
on:
  pull_request:

# 같은 PR에 새 푸시가 오면 이전 실행은 취소 (macOS 러너 분 절약)
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # 결과 코멘트

jobs:
  unit-test:
    name: 유닛 테스트 (seep-iosTests)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 러너 이미지(macos-26)의 기본 Xcode 사용. Realm 20.0.6 지원 범위는 Xcode 26.1-27
      # (사용 가능한 버전: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md)
      - name: Xcode 버전
        run: xcodebuild -version

      # Package.resolved 는 .gitignore 대상이라 버전이 고정된 project.pbxproj 로 키를 만든다
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('seep-ios.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 시뮬레이터 선택
        id: sim
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          for rt, devs in json.load(sys.stdin)["devices"].items():
              if "iOS" not in rt: continue
              for d in devs:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"]:
                      print(d["udid"]); sys.exit()
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      # 서명은 ad-hoc(-). CODE_SIGNING_ALLOWED=NO 로 끄면 App Group 엔타이틀먼트가 빠져 테스트 호스트가 실행 직후 크래시한다
      - name: xcodebuild test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project seep-ios.xcodeproj \
            -scheme seep-ios \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -quiet 2>&1 | tee build/xcodebuild.log | grep -E "error:|Executed|Test Suite|BUILD" || true
          test -d build/tests.xcresult

      - name: 결과 요약 (Job Summary)
        if: always()
        run: |
          mkdir -p build
          if [ -d build/tests.xcresult ]; then
            scripts/test-summary.sh build/tests.xcresult > build/summary.md
          else
            printf '### ❌ 테스트를 실행하지 못했습니다\n\n빌드 로그를 확인하세요.\n' > build/summary.md
          fi
          cat build/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 코멘트 (PR, 갱신형)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARK="<!-- test-evidence -->"
          { echo "$MARK"; cat build/summary.md; echo; echo "_[워크플로 실행](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"; } > build/comment.md
          ID="$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@build/comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file build/comment.md
          fi

      - name: xcresult 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests.xcresult
          path: build/tests.xcresult
          retention-days: 14
          if-no-files-found: ignore

      - name: 실패 판정
        if: always()
        run: |
          if [ ! -d build/tests.xcresult ]; then
            echo "::error::테스트가 실행되지 않았습니다 (빌드 실패 또는 이전 스텝 실패). 위 스텝 로그를 확인하세요."
            exit 1
          fi
          python3 - <<'PY'
          import json,subprocess,sys
          s=json.loads(subprocess.check_output(["xcrun","xcresulttool","get","test-results","summary","--path","build/tests.xcresult"]))
          ok = s.get("result")=="Passed" and s.get("failedTests",0)==0
          print("passed" if ok else f"failed: {s.get('failedTests')} failed tests")
          sys.exit(0 if ok else 1)
          PY

name: Test

# 모든 PR에서 실행 (base가 feature 브랜치인 스택 PR 포함)
on:
  pull_request:

# 같은 PR에 새 푸시가 오면 이전 실행은 취소 (macOS 러너 분 절약)
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # 실패·다시 통과 코멘트

jobs:
  unit-test:
    name: 유닛 테스트 (seep-iosTests)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 프로젝트 드리프트 (project.yml ↔ xcodeproj, GH-112)
        run: scripts/xcodegen.sh --check

      # 러너 이미지(macos-26)의 기본 Xcode 사용. Realm 20.0.6 지원 범위는 Xcode 26.1-27
      # (사용 가능한 버전: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md)
      - name: Xcode 버전
        run: xcodebuild -version

      # Package.resolved 는 .gitignore 대상이라 버전이 고정된 project.pbxproj 로 키를 만든다
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('seep-ios.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 시뮬레이터 선택
        id: sim
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          for rt, devs in json.load(sys.stdin)["devices"].items():
              if "iOS" not in rt: continue
              for d in devs:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"]:
                      print(d["udid"]); sys.exit()
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      # 서명은 ad-hoc(-). CODE_SIGNING_ALLOWED=NO 로 끄면 App Group 엔타이틀먼트가 빠져 테스트 호스트가 실행 직후 크래시한다
      - name: xcodebuild test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project seep-ios.xcodeproj \
            -scheme seep-ios \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -quiet 2>&1 | tee build/xcodebuild.log | grep -E "error:|Executed|Test Suite|BUILD" || true
          test -d build/tests.xcresult

      - name: 결과 요약 (Job Summary)
        if: always() && !cancelled()   # 새 푸시로 취소된 실행은 요약·코멘트를 남기지 않는다
        run: |
          mkdir -p build
          if [ -d build/tests.xcresult ]; then
            scripts/test-summary.sh build/tests.xcresult > build/summary.md
          else
            printf '### ❌ 테스트를 실행하지 못했습니다\n\n빌드 로그를 확인하세요.\n' > build/summary.md
          fi
          cat build/summary.md >> "$GITHUB_STEP_SUMMARY"

      # 모두 통과하면 코멘트를 달지 않는다(통과 증거는 이 체크의 초록). 실패가 있으면 실패한 테스트만,
      # 고친 뒤에는 직전에 실패했던 케이스만 "다시 통과"로 — 매번 새 코멘트(이력이 남도록, 이전 코멘트는 고치지 않는다).
      # 직전 실패 목록은 이 봇이 단 마지막 코멘트의 숨김 마커에서 읽는다 (scripts/test-failure-comment.py)
      - name: 실패 코멘트 (PR, 실패·다시 통과일 때만)
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- test-failures "))) | .body | @base64' \
            > build/prev-comments.txt
          scripts/test-failure-comment.py build/tests.xcresult build/prev-comments.txt "$RUN_URL" > build/comment.md
          if [ -s build/comment.md ]; then
            gh pr comment "$PR" --body-file build/comment.md
          else
            echo "코멘트 없음 (모두 통과했거나 직전과 같은 실패)"
          fi

      - name: xcresult 아티팩트
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: tests.xcresult
          path: build/tests.xcresult
          retention-days: 14
          if-no-files-found: ignore

      - name: 실패 판정
        if: always() && !cancelled()
        run: |
          if [ ! -d build/tests.xcresult ]; then
            echo "::error::테스트가 실행되지 않았습니다 (빌드 실패 또는 이전 스텝 실패). 위 스텝 로그를 확인하세요."
            exit 1
          fi
          python3 - <<'PY'
          import json,subprocess,sys
          s=json.loads(subprocess.check_output(["xcrun","xcresulttool","get","test-results","summary","--path","build/tests.xcresult"]))
          ok = s.get("result")=="Passed" and s.get("failedTests",0)==0
          print("passed" if ok else f"failed: {s.get('failedTests')} failed tests")
          sys.exit(0 if ok else 1)
          PY

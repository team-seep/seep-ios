name: Firebase 규칙

# GH-93: 보안 규칙·인덱스는 레포가 원본이다. PR에서 에뮬레이터로 테스트하고,
# develop에 머지되면 dev 프로젝트에, 수동 실행하면 prod 프로젝트에 배포한다.
on:
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-rules.yml"
  push:
    branches: [develop]
    paths:
      - "firebase/**"
  workflow_dispatch:
    inputs:
      target:
        description: "배포할 프로젝트 별칭"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  test:
    name: 규칙 테스트 (에뮬레이터)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json
      - uses: actions/setup-java@v4   # 에뮬레이터는 JDK 21 이상
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: firebase/tests
      - run: npx --yes firebase-tools@15.15.0 emulators:exec --only firestore,storage --project demo-seep "cd tests && npm test"

  deploy:
    name: 배포 (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'dev' }})
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 서비스 계정 키
        env:
          KEY_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          KEY_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: |
          if [ "$TARGET" = "prod" ]; then KEY="$KEY_PROD"; else KEY="$KEY_DEV"; fi
          if [ -z "$KEY" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT_${TARGET^^} 시크릿이 없다"; exit 1; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: npx --yes firebase-tools@15.15.0 deploy --only firestore,storage --project "$TARGET" --non-interactive

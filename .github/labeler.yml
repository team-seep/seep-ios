# 경로 기반 라벨 (actions/labeler v5). 검증 장치·Realm 스키마를 건드리는 PR을 결정론적으로 표시한다.
# 규칙: docs/process/verification-change.md

verification-change:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
          - ".swiftlint.yml"
          - ".swiftlint-baseline.json"
          - "scripts/**"
          - "makefile"
          - "seep-iosTests/**"
          - "docs/architecture/RULES.md"
          - "CLAUDE.md"
          - ".claude/skills/**"

baseline-change:
  - changed-files:
      - any-glob-to-any-file:
          - ".swiftlint-baseline.json"

schema-change:
  - changed-files:
      - any-glob-to-any-file:
          - "seep-ios/model/dto/**"
          - "seep-ios/AppDelegate.swift"
          - "seep-ios/Repository/RealmConfiguration.swift"
          - "widget/**/*Provider.swift"

# SwiftLint 설정
# 아키텍처 규칙(R1~R8)의 강제 수단. 규칙의 이유·예외는 docs/architecture/RULES.md 참고.
# SwiftUI 전환 완료(GH-64): UIKit·Rx 기준 규칙은 지웠다. UIKit 은 AppDelegate 만 쓴다.
# 기존 위반은 .swiftlint-baseline.json 에 동결되어 있다 (make lint-baseline 로 재생성). 새 위반만 보고된다.

baseline: .swiftlint-baseline.json

included:
  - seep-ios
  - seep-iosTests
  - widget

excluded:
  - build
  - seep-ios/Generated        # SwiftGen 산출물

# 레거시 스타일(2칸 들여쓰기·공백 등)까지 잡으면 신호가 묻힌다. 규칙 번호가 있는 것만 켠다.
only_rules:
  - force_cast                # R8
  - force_try                 # R8
  - type_body_length          # R7
  - file_length               # R7
  - custom_rules

# ---- 기본 룰 임계값 ----
type_body_length:             # R7 — 줄 수는 신호일 뿐. 초과는 disable:next + 사유
  warning: 400
  error: 400

file_length:                  # R7 — 같은 파일 extension 으로 옮겨 type_body_length 를 피하는 우회를 막는다
  warning: 600
  error: 600

force_cast: error
force_try: error

# ---- 아키텍처 custom rules (RULES.md 번호와 1:1) ----
custom_rules:

  no_uikit:                                 # R1 (GH-64)
    name: "R1 UIKit 신규 사용 금지"
    included: "seep-ios/.*"
    excluded: "seep-ios/AppDelegate\\.swift"
    regex: "^import UIKit\\b|\\b(UIViewRepresentable|UIViewControllerRepresentable|UIHostingController)\\b"
    message: "R1: 화면은 SwiftUI View + @Observable ViewModel 로 쓴다. UIKit·UIKit 래퍼를 새로 쓰지 않는다 (GH-64)."
    severity: error

  viewmodel_no_uikit_import:                # R2
    name: "R2 ViewModel 에서 UIKit import 금지"
    included: ".*ViewModel\\.swift"
    regex: "^import UIKit\\b"
    message: "R2: ViewModel 은 UI 를 모른다. UI 동작은 Route/Output 으로 ViewController 에 넘긴다."
    severity: error

  viewmodel_no_swiftui_import:              # R2 (GH-64)
    name: "R2 ViewModel 에서 SwiftUI import 금지"
    included: ".*ViewModel\\.swift"
    regex: "^import SwiftUI\\b"
    message: "R2: ViewModel 은 Foundation·Observation(필요하면 Combine)만 쓴다. 화면 표현은 View 에서 한다."
    severity: error

  viewmodel_no_uiapplication:               # R2
    name: "R2 ViewModel 에서 UIApplication 금지"
    included: ".*ViewModel\\.swift"
    regex: "UIApplication\\.shared"
    message: "R2: URL 열기·알럿 등 UI 동작은 Route 로 ViewController 에서 처리한다."
    severity: error

  realm_only_in_repository:                 # R3
    name: "R3 Realm 접근은 Repository 에서만"
    excluded:
      - "widget/.*"                # 위젯은 앱 Repository 를 못 쓰는 별도 타깃 (RULES.md R3 예외)
      - "seep-ios/Repository/.*"
      - "seep-ios/AppDelegate\\.swift"
    regex: "\\bRealm\\(|realm\\.(write|beginWrite|objects|add|delete)\\b"
    message: "R3: Realm 읽기/쓰기는 Repository(Protocol+Impl) 에서만. ViewModel 은 Dependency 로 Repository 를 주입받는다."
    severity: error

  no_raw_sheet:                             # R5 (GH-64)
    name: "R5 시트는 seepSheet 로만"
    included: "seep-ios/.*"
    excluded: "seep-ios/AppShell/SeepSheet\\.swift"
    regex: "\\.(sheet|fullScreenCover)\\("
    message: "R5: 시트·풀스크린은 .seepSheet(item:) / .seepFullScreenCover(item:) 로 띄운다 (앱 잠금 오버레이·detent 통일)."
    severity: error

  no_color_literal:                         # R6 SwiftUI (GH-64)
    name: "R6 Color 리터럴 금지"
    included: "seep-ios/.*"
    excluded: "seep-ios/DesignSystem/SeepColor\\.swift"
    regex: "\\bColor\\((r|red|white|hex):"
    message: "R6: 색은 SeepColor 토큰(Color.gray5, .seepBlue …)만 쓴다. 새 색은 토큰부터 추가한다."
    severity: error

  no_font_custom:                           # R6 SwiftUI (GH-64)
    name: "R6 Font.custom 금지"
    included: "seep-ios/.*"
    excluded: "seep-ios/DesignSystem/SeepFont\\.swift"
    regex: "\\.custom\\(\""
    message: "R6: 폰트는 SeepFont(Font.appleBold(size:) …)만 쓴다."
    severity: error

  no_text_literal:                          # R6 SwiftUI (GH-64)
    name: "R6 Text 문자열 리터럴 금지"
    included: "seep-ios/.*"
    regex: "\\bText\\(\""
    message: "R6: 화면 문구는 Text(Strings.xxx). 번역하지 않는 값은 Text(verbatim:)."
    severity: error

  no_localized_literal:                     # R6
    name: "R6 \"key\".localized 금지"
    excluded: "widget/.*"
    regex: "\"[A-Za-z0-9_]+\"\\.localized\\b"
    message: "R6: 문자열은 SwiftGen 의 Strings.xxx 를 쓴다 (키 오타가 컴파일 에러로 잡힌다). 새 키는 Localization.strings 에 추가 후 swiftgen."
    severity: error

  length_disable_reason:                    # R7
    name: "R7 길이 예외는 사유 필수"
    regex: "swiftlint:disable(:next|:this|:previous)?\\s+(type_body_length|file_length)\\s*$"
    match_kinds: comment
    message: "R7: 길이 예외는 책임이 하나인 이유를 적는다. 예) // swiftlint:disable:next type_body_length - 셀 레이아웃만 담당"
    severity: error

  no_print:                                 # R8
    name: "R8 print 금지"
    regex: "(^|[^.\\w])print\\("
    message: "R8: print 를 남기지 않는다. 에러는 Result / Output.route(.showErrorAlert) 로 전파한다."
    severity: error

reporter: "xcode"
